
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friend Monopoly</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#15121f;color:#fff;font:15px Arial,sans-serif;padding:18px}
main{max-width:1050px;margin:auto}
h1{color:#ff79bd;text-align:center}
.panel{background:#211c30;border:1px solid #453854;border-radius:16px;padding:16px;margin:12px 0}
input,button{padding:12px;border-radius:9px;font-size:15px}
input{width:100%;margin:6px 0 12px;background:#171321;color:white;border:1px solid #554967}
button{border:0;cursor:pointer;font-weight:bold;background:#ff79bd;color:#241426;margin:4px}
button:disabled{opacity:.4}
.secondary{background:#39304e;color:white}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.space{background:#302940;border:1px solid #5a4c6d;border-radius:8px;padding:7px 3px;text-align:center;min-height:88px;overflow-wrap:anywhere;font-size:11px}
.space strong{display:block;font-size:11px;margin-bottom:5px}
.space .price{color:#ffb8dd}
.space .tokens{margin-top:5px;color:#bda8ff;font-weight:bold}
.space.current{outline:2px solid #ff79bd}
.space.owned{background:#45365a}
#playersList{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.player{background:#302940;border-radius:9px;padding:10px}
.muted{color:#bcb5ce;font-size:13px}
#message{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>🎲 Friend Monopoly</h1>

<section class="panel" id="entry">
<h2>Join a game</h2>
<label>Name</label><input id="name" maxlength="20" placeholder="Your name">
<label>Room code</label><input id="code" maxlength="8" placeholder="Example: PINK7">
<div class="row">
<button id="create">Create room</button>
<button class="secondary" id="join">Join room</button>
</div>
<p class="muted">Share the room code with your friends.</p>
</section>

<section class="panel hidden" id="lobby">
<h2>Room <span id="roomCode"></span></h2>
<div id="playersList"></div>
<p id="lobbyStatus" class="muted">Waiting for players...</p>
<div class="row">
<button id="ready">I'm ready</button>
<button id="start" class="hidden">Start game</button>
<button id="leave" class="secondary">Leave</button>
</div>
</section>

<section class="panel hidden" id="game">
<h2>Monopoly board</h2>
<p id="turnInfo"></p>
<div id="board"></div>
<div class="panel">
<p id="dice">Dice: not rolled yet</p>
<p id="currentSpace"></p>
<div class="row">
<button id="roll">Roll dice</button>
<button id="buy">Buy property</button>
<button id="endTurn" class="secondary">End turn</button>
</div>
</div>
<h3>Players</h3>
<div id="gamePlayers"></div>
<h3>Owned properties</h3>
<div id="owned"></div>
</section>

<div id="message" class="panel muted">Connecting...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

// Use your existing Supabase project details.
const SUPABASE_URL = "https://yghlbyfkkwpzmvbkwbob.supabase.co";
const SUPABASE_KEY = "sb_publishable_42gwT-h8zvxfbQeXv_HxRQ_BKxAOKY3";

const $ = id => document.getElementById(id);
const names = [
"GO","Mediterranean Avenue","Community Chest","Baltic Avenue",
"Income Tax","Reading Railroad","Oriental Avenue","Chance",
"Vermont Avenue","Connecticut Avenue","Jail / Visiting",
"St. Charles Place","Electric Company","States Avenue",
"Virginia Avenue","Pennsylvania Railroad","St. James Place",
"Community Chest","Tennessee Avenue","New York Avenue",
"Free Parking","Kentucky Avenue","Chance","Indiana Avenue",
"Illinois Avenue","B. & O. Railroad","Atlantic Avenue",
"Ventnor Avenue","Water Works","Marvin Gardens","Go To Jail",
"Pacific Avenue","North Carolina Avenue","Community Chest",
"Pennsylvania Avenue","Short Line","Chance","Park Place",
"Luxury Tax","Boardwalk"
];
const prices = [0,60,0,60,0,200,100,0,100,120,0,140,150,140,160,200,180,0,180,200,0,220,0,220,240,200,260,260,150,280,0,300,300,0,320,200,0,350,0,400];
let db, userId, roomId, roomCode, hostId, ready = false, refreshTimer;
let myPosition = 0, myMoney = 1500, hasRolled = false;
let lastDice = null;

function say(s){ $("message").textContent = s; }
function callRpc(fn,args){ return db.rpc(fn,args); }

async function guest(){
  const {data,error}=await db.auth.getSession();
  if(error)throw error;
  if(data.session){userId=data.session.user.id;return;}
  const r=await db.auth.signInAnonymously();
  if(r.error)throw r.error;
  userId=r.data.user.id;
}

async function enterRoom(action){
  try{
    const name=$("name").value.trim();
    const code=$("code").value.trim().toUpperCase();
    if(!name)throw Error("Enter your name.");
    if(!/^[A-Z0-9]{4,8}$/.test(code))throw Error("Room code must be 4–8 letters or numbers.");
    await guest();
    const fn=action==="create"?"create_game_room":"join_game_room";
    const {data,error}=await callRpc(fn,{p_room_code:code,p_player_name:name});
    if(error)throw error;
    roomId=data;
    await loadRoom();
    $("entry").classList.add("hidden");
    $("lobby").classList.remove("hidden");
    if(refreshTimer)clearInterval(refreshTimer);
    refreshTimer=setInterval(()=>loadRoom().catch(e=>say(e.message)),2500);
    say("Connected to "+roomCode+".");
  }catch(e){say("Couldn't "+action+" room: "+e.message);}
}

async function loadRoom(){
  if(!roomId)return;
  const rr=await db.from("game_rooms")
    .select("id,room_code,status,creator_id,current_turn_user_id,last_dice_1,last_dice_2")
    .eq("id",roomId).single();
  if(rr.error)throw rr.error;
  const room=rr.data;
  roomCode=room.room_code;hostId=room.creator_id;
  $("roomCode").textContent=roomCode;

  const pr=await db.from("game_players")
    .select("user_id,player_name,money,board_position,is_ready,has_rolled,turn_order")
    .eq("room_id",roomId).order("joined_at");
  if(pr.error)throw pr.error;
  const players=pr.data;
  const me=players.find(p=>p.user_id===userId);
  if(me){myPosition=me.board_position;myMoney=me.money;ready=me.is_ready;hasRolled=me.has_rolled;}

  $("playersList").innerHTML="";
  players.forEach(p=>{
    const d=document.createElement("div");d.className="player";
    d.textContent=p.player_name+(p.user_id===hostId?" (Host)":"")+
      (p.is_ready?" ✓ Ready":" — Not ready");
    $("playersList").append(d);
  });
  $("ready").textContent=ready?"Ready ✓":"I'm ready";
  $("start").classList.toggle("hidden",hostId!==userId||room.status!=="waiting");
  $("lobbyStatus").textContent=hostId===userId
    ?"You are the host. Everyone must be ready."
    :"Waiting for the host to start.";

  if(room.status==="playing"){
    $("lobby").classList.add("hidden");
    $("game").classList.remove("hidden");
    await drawBoard(players);
    await drawProperties();
    const current=players.find(p=>p.user_id===room.current_turn_user_id);
    $("turnInfo").textContent=current
      ? "Current turn: "+current.player_name+(current.user_id===userId?" (your turn)":"")
      :"Waiting for turn information.";
    $("roll").disabled=room.current_turn_user_id!==userId||hasRolled;
    $("buy").disabled=room.current_turn_user_id!==userId||!hasRolled;
    $("endTurn").disabled=room.current_turn_user_id!==userId||!hasRolled;
    $("dice").textContent=room.last_dice_1
      ?"Last roll: "+room.last_dice_1+" + "+room.last_dice_2
      :"Roll the dice to move.";
  }
}

async function drawBoard(players){
  const ownR=await db.from("game_properties")
    .select("space_index,owner_user_id").eq("room_id",roomId);
  if(ownR.error)throw ownR.error;
  const owned=new Map(ownR.data.map(p=>[p.space_index,p.owner_user_id]));
  const board=$("board");board.innerHTML="";
  for(let i=0;i<40;i++){
    const d=document.createElement("div");
    d.className="space"+(owned.has(i)?" owned":"")+
      (players.some(p=>p.user_id===userId&&p.board_position===i)?" current":"");
    const title=document.createElement("strong");title.textContent=i+" · "+names[i];
    const price=document.createElement("div");price.className="price";
    price.textContent=prices[i]?"$"+prices[i]:"";
    const tokens=document.createElement("div");tokens.className="tokens";
    tokens.textContent=players.filter(p=>p.board_position===i)
      .map(p=>p.player_name.slice(0,3)).join(" · ");
    d.append(title,price,tokens);board.append(d);
  }
  const space=names[myPosition];
  $("currentSpace").textContent="Your space: "+space+" | Your money: $"+myMoney;
}

async function drawProperties(){
  const r=await db.from("game_properties")
    .select("space_index,owner_user_id").eq("room_id",roomId);
  if(r.error)throw r.error;
  const p=await db.from("game_players")
    .select("user_id,player_name").eq("room_id",roomId);
  if(p.error)throw p.error;
  $("owned").textContent=r.data.length?r.data.map(x=>{
    const owner=p.data.find(y=>y.user_id===x.owner_user_id);
    return names[x.space_index]+" — "+(owner?owner.player_name:"Unknown");
  }).join(" | "):"No properties owned yet.";
}

async function setReady(){
  try{
    const {error}=await callRpc("set_player_ready",{p_room_id:roomId,p_is_ready:!ready});
    if(error)throw error;
    await loadRoom();
  }catch(e){say("Ready error: "+e.message);}
}

async function startGame(){
  try{
    const {error}=await callRpc("start_game",{p_room_id:roomId});
    if(error)throw error;
    await loadRoom();
  }catch(e){say("Start error: "+e.message);}
}

async function roll(){
  try{
    const {data,error}=await callRpc("roll_turn",{p_room_id:roomId});
    if(error)throw error;
    lastDice=data[0];
    say("You rolled "+lastDice.dice_1+" and "+lastDice.dice_2+".");
    await loadRoom();
  }catch(e){say("Roll error: "+e.message);}
}

async function buy(){
  try{
    const {error}=await callRpc("buy_property",{p_room_id:roomId});
    if(error)throw error;
    say("Property purchased!");
    await loadRoom();
  }catch(e){say("Purchase error: "+e.message);}
}

async function endTurn(){
  try{
    const {error}=await callRpc("end_turn",{p_room_id:roomId});
    if(error)throw error;
    say("Turn ended.");
    await loadRoom();
  }catch(e){say("End-turn error: "+e.message);}
}

$("create").onclick=()=>enterRoom("create");
$("join").onclick=()=>enterRoom("join");
$("ready").onclick=setReady;
$("start").onclick=startGame;
$("roll").onclick=roll;
$("buy").onclick=buy;
$("endTurn").onclick=endTurn;
$("leave").onclick=()=>{
  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=null;roomId=null;
  $("lobby").classList.add("hidden");
  $("game").classList.add("hidden");
  $("entry").classList.remove("hidden");
  say("Left the lobby screen. Your player record remains in the room.");
};

(async()=>{
  if(!window.supabase){say("Supabase failed to load.");return;}
  if(SUPABASE_URL.includes("PASTE_YOUR")||SUPABASE_KEY.includes("PASTE_YOUR")){
    say("Add your real Supabase URL and public publishable key first.");return;
  }
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  say("Ready to play!");
})();
</script>
</body>
</html>
